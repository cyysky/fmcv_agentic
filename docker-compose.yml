services:
  frontend:
    build:
      context: ./frontend
      args:
        # NEXT_PUBLIC_* must be set at BUILD time (inlined by Next). Runtime
        # `environment` entries for NEXT_PUBLIC_* are ignored.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://10.0.151.7:5555/api}
        NEXT_PUBLIC_API_TOKEN: ${NEXT_PUBLIC_API_TOKEN:-}
    container_name: fmcv-frontend
    ports:
      - "3333:3333"
    environment:
      - NODE_ENV=production
      # Server-side base URL the file-view proxy uses to reach the backend
      # (the browser-facing NEXT_PUBLIC_API_URL is the client's own default).
      - API_INTERNAL_URL=${API_INTERNAL_URL:-http://backend:5555/api}
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: fmcv-backend
    ports:
      - "5555:5555"
    environment:
      - NODE_ENV=production
      - PORT=5555
      - DATABASE_URL=postgresql://fmcv:fmcv_dev_password@db:5432/fmcv?schema=public
      - AGENT_BASE_URL=${AGENT_BASE_URL:-http://60.51.17.97:9999/v1}
      - AGENT_API_KEY=${AGENT_API_KEY:-}
      - AGENT_WORKSPACE_ROOT=${AGENT_WORKSPACE_ROOT:-/data/workspaces}
      - API_TOKEN=${API_TOKEN:-}
      - RATE_LIMIT_TTL_MS=${RATE_LIMIT_TTL_MS:-60000}
      - RATE_LIMIT_MAX=${RATE_LIMIT_MAX:-100}
      # Empty/absent = scheduler enabled. Set CRON_SCHEDULER_ENABLED=false
      # for an API-only node (no background firing; CRUD + Run now still work).
      - CRON_SCHEDULER_ENABLED=${CRON_SCHEDULER_ENABLED:-}
      # Agent web access (DIRECTION items 1 + 4): try the host's CDP Chrome
      # on 9222 first, then fall back to native fetch inside the backend.
      # Host Chrome binds 9222 loopback-only, so run the bundled relay
      # (`node scripts/cdp-relay.mjs`, 0.0.0.0:9222 -> 127.0.0.1:9223) to
      # make CDP reachable from inside the container.
      - WEB_CDP_HOST=${WEB_CDP_HOST:-host.docker.internal}
      - WEB_CDP_PORT=${WEB_CDP_PORT:-9222}
      - WEB_FETCH_TIMEOUT_MS=${WEB_FETCH_TIMEOUT_MS:-30000}
      # Web-search provider pin (Round 127): auto = DDG first with a Bing RSS
      # fallback when bot-walled; duckduckgo|bing force exactly one provider
      # (no retry) so E2E runs can assert a deterministic provider.
      - WEB_SEARCH_PROVIDER=${WEB_SEARCH_PROVIDER:-auto}
    extra_hosts:
      # Resolves host.docker.internal to the Docker host so the backend can
      # reach the host's local Chrome DevTools instance on port 9222.
      - "host.docker.internal:host-gateway"
    volumes:
      - workspace_data:/data/workspaces
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: fmcv-db
    environment:
      - POSTGRES_USER=fmcv
      - POSTGRES_PASSWORD=fmcv_dev_password
      - POSTGRES_DB=fmcv
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    # Postgres is exposed on the host (5432) so local tooling (prisma migrate)
    # can reach it; it is also reachable from other services on the compose
    # network via the service name `db`.

volumes:
  postgres_data:
  workspace_data:
