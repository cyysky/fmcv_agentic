services:
  frontend:
    build:
      context: ./frontend
    container_name: fmcv-frontend
    ports:
      - "3333:3333"
    environment:
      - NODE_ENV=production
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: fmcv-backend
    ports:
      - "5555:5555"
    environment:
      - NODE_ENV=production
      - PORT=5555
    restart: unless-stopped
